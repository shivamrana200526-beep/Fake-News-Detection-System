services:
  - type: web
    name: satyacheck
    runtime: node
    plan: free
    buildCommand: >
      npm install -g pnpm &&
      pnpm install --no-frozen-lockfile &&
      BASE_PATH=/ pnpm --filter @workspace/fake-news-defense run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: satyacheck-db
          property: connectionString

databases:
  - name: satyacheck-db
    databaseName: satyacheck
    user: satyacheck
    plan: free
